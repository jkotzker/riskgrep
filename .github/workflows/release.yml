name: Release

# Publishes the workspace crates to crates.io when a GitHub release is
# published, then adds the crates.io links and the published .crate files to
# that release. Authentication uses crates.io Trusted Publishing (OIDC): no API
# token is stored in this repository. The `release` environment requires the
# maintainer's approval before the publish job starts.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      # write: to add the crates.io section and assets to the release.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml selects the pinned toolchain.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Check the tag matches the crate version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print({p["name"]: p["version"] for p in json.load(sys.stdin)["packages"]}["riskgrep-core"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG does not match workspace version v$version"
            exit 1
          fi

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --locked

      # `cargo publish` leaves the packages it uploaded in target/package/.
      # The script checks each one against the checksum in the crates.io index
      # and copies only the verified files to $out/assets, which is all that
      # gets attached.
      - name: Add the crates.io links and .crate files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          out="$RUNNER_TEMP/release"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/body.md"
          python3 .github/scripts/crates_release_assets.py \
            --package-dir target/package --out-dir "$out" \
            --body-in "$RUNNER_TEMP/body.md" --run-url "$RUN_URL"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$out"/assets/*
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$out/release-body.md"
