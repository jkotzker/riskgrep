name: Release

# Publishes the workspace crates to crates.io when a GitHub release is
# published. Authentication uses crates.io Trusted Publishing (OIDC): no API
# token is stored in this repository. The `release` environment requires the
# maintainer's approval before the publish job starts.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # rust-toolchain.toml selects the pinned toolchain.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Check the tag matches the crate version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print({p["name"]: p["version"] for p in json.load(sys.stdin)["packages"]}["riskgrep-core"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG does not match workspace version v$version"
            exit 1
          fi

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --locked
