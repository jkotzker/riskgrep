name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # A stable name for the branch rulesets' required checks:
    # `test (macos-latest)` and `test (ubuntu-latest)`.
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # rust-toolchain.toml selects the toolchain (a pinned stable release
      # with clippy and rustfmt); this installs it so later steps do not do
      # so implicitly.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --release -p riskgrep -p riskgrep-claude

      - name: Rule tests
        run: ./target/release/riskgrep rules test

      # No public-repository clones in CI: the OSS half of the evaluation
      # needs network access and about 850 MB.
      - name: Evaluation (synthetic corpus)
        run: cargo xtask eval --skip-oss

      - name: Install hyperfine
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install hyperfine
          else
            sudo apt-get update
            sudo apt-get install -y hyperfine
          fi

      # Informational on hosted runners: the p95 targets are for the
      # reference machine, and shared runners are slower and noisier, so a
      # miss here is a signal to look at, not a failure. The local
      # `cargo xtask bench` is the gate. The regression check also needs a
      # baseline from the same OS; skip, with a message, until one is committed.
      - name: Benchmarks (informational)
        continue-on-error: true
        shell: bash
        run: |
          os=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          if [ -f "bench/baseline-$os.json" ]; then
            cargo xtask bench
          else
            echo "::notice::bench/baseline-$os.json not found: benchmarks skipped for $RUNNER_OS. Generate one with 'cargo xtask bench --write-baseline' on that OS and commit it."
          fi

  riskgrep:
    # A stable name for the branch rulesets' required check. The scan uses the
    # committed `.riskgrep.toml` and the scanner built from this checkout.
    name: riskgrep scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install

      # Caches the cargo registry only: the build goes outside the checkout
      # (below), so that the scan of `.` does not walk the build output.
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          cache-targets: "false"

      - name: Build riskgrep
        run: cargo build --release -p riskgrep --target-dir "$RUNNER_TEMP/target"

      # HOME points at an empty directory, so no user configuration or cache
      # applies. The summary lists rule ids, paths, and scores; the report
      # never holds matched values.
      - name: Scan the repository
        shell: bash
        run: |
          # GitHub runs bash with -e; the exit status is kept and returned last.
          set +e -uo pipefail
          home="$RUNNER_TEMP/riskgrep-home"
          report="$RUNNER_TEMP/riskgrep.json"
          mkdir -p "$home"
          HOME="$home" "$RUNNER_TEMP/target/release/riskgrep" scan . \
            --fail-at secret=80,biometric=75 --on-error block \
            --format json --no-cache > "$report"
          status=$?
          {
            echo "## RiskGrep scan"
            echo
            echo "Fails at secret 80 or biometric 75, or when a target cannot be scanned."
            echo
            if [ -s "$report" ]; then
              echo "| Target | secret | biometric | Status | Rules |"
              echo "|---|---|---|---|---|"
              jq -r '
                .targets[]
                | select(([.scores[]] | add // 0) > 0 or .status == "unscanned")
                | "| `\(.target)` | \(.scores.secret // 0) | \(.scores.biometric // 0) | \(.status) | \([.evidence[].rule] | unique | join(", ")) |"
              ' "$report"
              echo
              jq -r '.summary | "Total: \(.targets) targets (\(.scanned) scanned, \(.partial) partial, \(.skipped) skipped, \(.unscanned) unscanned); \(.suppressed) findings suppressed by the configuration; highest scores: secret \(.scores.secret // 0), biometric \(.scores.biometric // 0)."' "$report"
            else
              echo "No report was written."
            fi
            echo
            case "$status" in
              0) echo "**Pass:** no target reaches a threshold." ;;
              1) echo "**Fail:** a target reaches a threshold." ;;
              2) echo "**Fail:** a target could not be scanned." ;;
              *) echo "**Fail:** riskgrep exited with status $status." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
