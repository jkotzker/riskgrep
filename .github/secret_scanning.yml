# GitHub secret scanning: files whose secret-like strings are rule data, not
# secrets. gitleaks.toml is the vendored upstream rule set; its gcp-api-key
# allowlist holds publicly known Google API keys. gitleaks.yar is generated
# from it. RiskGrep's own CI scan still covers these paths.
paths-ignore:
  - "xtask/upstream/gitleaks.toml"
  - "crates/riskgrep-core/rulesets/secrets-core/gitleaks.yar"
