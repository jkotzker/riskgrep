[workspace]
resolver = "2"
members = ["crates/riskgrep-core", "crates/riskgrep", "crates/riskgrep-claude", "xtask"]

[workspace.package]
version = "1.0.1"
edition = "2021"
# The toolchain pinned in rust-toolchain.toml: the only release the project
# is built and tested with.
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
authors = ["Joseph Kotzker"]
repository = "https://github.com/jkotzker/riskgrep"
homepage = "https://github.com/jkotzker/riskgrep"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
