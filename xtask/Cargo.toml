[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
path = "src/convert.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
riskgrep-core = { path = "../crates/riskgrep-core", version = "1.1.0" }
regex = "1.13"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1.1.8"
tempfile = "3.27.0"
