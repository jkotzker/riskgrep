[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
path = "src/convert.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
regex = "1.13"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "1.1.8"

[dev-dependencies]
riskgrep-core = { path = "../crates/riskgrep-core" }
tempfile = "3.27.0"
