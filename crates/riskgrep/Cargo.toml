[package]
name = "riskgrep"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "riskgrep"
path = "src/main.rs"

[dependencies]
riskgrep-core = { path = "../riskgrep-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.8"
include_dir = "0.7.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3.27.0"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
