[package]
name = "riskgrep"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Local scanner that scores files from 0 to 100 for secrets and biometric embeddings, with a git pre-commit hook; never records matched values"
keywords = ["secrets", "scanner", "pre-commit", "biometrics", "security"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "riskgrep"
path = "src/main.rs"

[dependencies]
riskgrep-core = { path = "../riskgrep-core", version = "1.0.0" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3.27.0"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
