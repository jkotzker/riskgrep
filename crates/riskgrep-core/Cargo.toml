[package]
name = "riskgrep-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Scoring engine of RiskGrep: scores files from 0 to 100 for secrets and biometric embeddings with YARA-X rules and structural checks, without recording matched values"
keywords = ["secrets", "scanner", "yara", "biometrics", "security"]
categories = ["development-tools", "filesystem"]

[dependencies]
yara-x = { version = "=1.23.0", default-features = false, features = ["constant-folding", "exact-atoms", "fast-regexp", "math-module", "string-module", "native-code-serialization"] }
serde = { version = "1", features = ["derive"] }
blake3 = "1.8.7"
include_dir = "0.7.4"
toml = "1.1.8"
libc = "0.2.191"
regex = "1.13"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
globset = "0.4"
getrandom = "0.4"
tar = { version = "0.4.46", default-features = false }

[features]
# Measurement only (issue #110): a deliberate slowdown, the positive control
# for the instruction-count spread runs. Never part of a release.
bench-slowdown = []

[build-dependencies]
blake3 = "1.8.7"

[dev-dependencies]
regex-syntax = "0.8"
tempfile = "3.27.0"
