[package]
name = "riskgrep-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Scoring engine of RiskGrep: scores files from 0 to 100 for secrets and biometric embeddings with YARA-X rules and structural checks, without recording matched values"
keywords = ["secrets", "scanner", "yara", "biometrics", "security"]
categories = ["development-tools", "filesystem"]

[dependencies]
yara-x = { version = "=1.22.0", default-features = false, features = ["constant-folding", "exact-atoms", "fast-regexp", "math-module", "string-module", "native-code-serialization"] }
# yara-x accepts any 1.x of its own macros and parser crates, and the 1.22.0
# macros crate does not compile against yara-x 1.21.0 (VirusTotal/yara-x#819).
# Pinned here so an install that resolves dependencies without Cargo.lock
# (`cargo install riskgrep`) gets matching versions. Not used directly; move
# these with the yara-x pin.
yara-x-macros = "=1.22.0"
yara-x-parser = "=1.22.0"
serde = { version = "1", features = ["derive"] }
blake3 = "1.8.7"
include_dir = "0.7.4"
toml = "1.1.8"
libc = "0.2.191"
regex = "1.13"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
globset = "0.4"
getrandom = "0.4"

[build-dependencies]
blake3 = "1.8.7"

[dev-dependencies]
regex-syntax = "0.8"
tempfile = "3.27.0"
