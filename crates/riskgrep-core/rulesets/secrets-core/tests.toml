# ---- password-manager vaults (vaults.yar) --------------------------------------

[[case]]
# KeePass database: signature 9AA2D903 then B54BFB67 (KDBX), then random bytes.
rule = "keepass_database"
synth = "der:03d9a29a67fb4bb5"
path = "Passwords.kdbx"
expect = 85

[[case]]
# KeePass 1.x database (.kdb): second signature B54BFB65.
rule = "keepass_database"
synth = "der:03d9a29a65fb4bb5"
path = "old.kdb"
expect = 85

[[case]]
# The magic is what counts, not the name.
rule = "keepass_database"
synth = "der:03d9a29a67fb4bb5"
path = "backup.dat"
expect = 85

[[case]]
rule = "keepass_database"
synth = "text:not a vault, only named like one"
path = "notes.kdbx"
expect = "none"

[[case]]
# macOS keychain file: `kych`, version 1.0.
rule = "macos_keychain_file"
synth = "der:6b79636800010000"
path = "login.keychain-db"
expect = 85

[[case]]
rule = "macos_keychain_file"
synth = "text:kych is also a word"
path = "notes.txt"
expect = "none"

[[case]]
# Password Safe v3 database: `PWS3` and the .psafe3 extension.
rule = "password_safe_database"
synth = "der:50575333"
path = "vault.psafe3"
expect = 85

[[case]]
