[[case]]
# Percent-encoded URI, as in a QR-code image link.
rule = "otpauth_totp_seed"
synth = "file:otpauth_encoded"
path = "qr.html"
expect = 95

[[case]]
# The public example seeds stay allowed in the encoded form.
rule = "otpauth_totp_seed"
synth = "file:otpauth_encoded_example_secret"
path = "README.md"
expect = "none"

[[case]]
rule = "otpauth_totp_seed"
synth = "file:otpauth_encoded_no_secret"
path = "qr.html"
expect = "none"

[[case]]
# KeePass XML key file, version 1.00 (base64 key).
rule = "keepass_xml_key_file"
synth = "file:keepass_key_file_v1"
path = "backup.dat"
expect = 85

[[case]]
# Version 2.0 (hex key with a check hash).
rule = "keepass_xml_key_file"
synth = "file:keepass_key_file_v2"
path = "Database.keyx"
expect = 85

[[case]]
rule = "keepass_xml_key_file"
synth = "file:keepass_key_file_lookalike"
path = "settings.xml"
expect = "none"

[[case]]
# A Password Safe v3 layout is recognised without the extension.
rule = "password_safe_database"
synth = "file:password_safe_structural"
path = "backup"
expect = 85

[[case]]
# PWS3, but not 200 bytes plus whole 16-byte blocks.
rule = "password_safe_database"
synth = "file:password_safe_wrong_size"
path = "backup"
expect = "none"

[[case]]
# PWS3 with an iteration count below the 2,048 minimum.
rule = "password_safe_database"
synth = "file:password_safe_low_iterations"
path = "backup"
expect = "none"

[[case]]
rule = "password_safe_database"
synth = "text:PWS3 build notes, a text file that only starts with the letters\n"
path = "notes.txt"
expect = "none"

[[case]]
# A line feed at offset 39 makes the bytes after the salt look like a count.
rule = "password_safe_database"
synth = "text:PWS3xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\nmore notes\n"
path = "notes.txt"
expect = "none"

[[case]]
# The extension still counts.
rule = "password_safe_database"
synth = "file:password_safe_wrong_size"
path = "vault.psafe3"
expect = 85

