# ---- credentials in configuration files (config.yar) -------------------------

[[case]]
# A hex credential in an XML element named like one (the *arr apps' layout).
rule = "xml_credential_element"
synth = "file:config_xml_credential"
path = "config.xml"
expect = 80

[[case]]
rule = "xml_credential_element"
synth = "file:config_xml_credential:11"
path = "config.xml"
expect = 80

[[case]]
rule = "xml_credential_element"
synth = "file:config_xml_credential:12"
path = "config.xml"
expect = 80

[[case]]
# Public keys, a bare `Key`, a primary key, and pagination tokens.
rule = "xml_credential_element"
synth = "file:config_xml_non_secret"
path = "config.xml"
expect = "none"

[[case]]
# Placeholders, templates, short values, sequential digits, and prose.
rule = "xml_credential_element"
synth = "text:<Config>\n  <ApiKey>changeme</ApiKey>\n  <Password>${DB_PASSWORD}</Password>\n  <Token>{{ api_token }}</Token>\n  <SecretKey>abc123</SecretKey>\n  <Password>correct horse battery staple</Password>\n  <ApiKey>0123456789abcdef0123456789abcdef</ApiKey>\n  <ApiKey>your-api-key-goes-here</ApiKey>\n  <ApiKey>xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx</ApiKey>\n  <ClientKey>/etc/ssl/private/client2.pem</ClientKey>\n  <ApiKey>12345678901234567890</ApiKey>\n</Config>\n"
path = "config.xml"
expect = "none"

[[case]]
# Members of a JSON object named like a credential store (Z-Wave JS UI keeps
