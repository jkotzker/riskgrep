# Cases for `riskgrep rules test`; the generator language is in ../README.md.

[[case]]
rule = "aws_access_token"
synth = "secret:aws_access_key"
path = "src/main.rs"
expect = 95

[[case]]
rule = "github_pat"
synth = "secret:github_pat"
path = "src/main.rs"
expect = 95

[[case]]
rule = "anthropic_api_key"
synth = "secret:anthropic_key"
path = "src/main.rs"
expect = 95

[[case]]
rule = "private_key"
synth = "secret:pem_private_key"
path = "deploy/id_rsa"
expect = 95

[[case]]
rule = "generic_api_key"
synth = "secret:generic_api_key_assignment"
path = "settings.py"
expect = 80

[[case]]
rule = "stripe_access_token"
synth = "secret:stripe_key"
path = "src/main.rs"
expect = 95

[[case]]
rule = "slack_bot_token"
synth = "secret:slack_bot_token"
path = "src/main.rs"
expect = 95

[[case]]
rule = "npm_access_token"
synth = "secret:npm_token"
path = "src/main.rs"
expect = 95

[[case]]
rule = "openai_api_key"
synth = "secret:openai_key"
path = "src/main.rs"
expect = 95

[[case]]
rule = "pkcs12_keystore"
synth = "der:3082012c"
path = "certs/client.p12"
expect = 90

[[case]]
# PKCS#8 PrivateKeyInfo (RSA): SEQUENCE, INTEGER 0, SEQUENCE.
rule = "der_key_file"
synth = "der:3082012c02010030"
path = "keys/server.der"
expect = 90

[[case]]
# PKCS#1 RSAPrivateKey: SEQUENCE, INTEGER 0, INTEGER.
rule = "der_key_file"
synth = "der:3082012c02010002"
path = "keys/server.der"
expect = 90

[[case]]
# SEC1 ECPrivateKey (P-256): SEQUENCE, INTEGER 1, OCTET STRING.
rule = "der_key_file"
synth = "der:307702010104"
path = "keys/server.key"
expect = 90

[[case]]
# SEC1 ECPrivateKey (P-384), two-byte length form.
rule = "der_key_file"
synth = "der:3081a402010104"
path = "keys/server.key"
expect = 90

[[case]]
# PKCS#8 PrivateKeyInfo (P-256), two-byte length form.
rule = "der_key_file"
synth = "der:30818702010030"
path = "keys/server.der"
expect = 90

[[case]]
# PKCS#8 Ed25519 or X25519: one-byte length 0x2e.
rule = "der_key_file"
synth = "der:302e02010030"
path = "keys/ed25519.der"
expect = 90

[[case]]
# PKCS#8 Ed448: one-byte length 0x47.
rule = "der_key_file"
synth = "der:304702010030"
path = "keys/ed448.key"
expect = 90

[[case]]
# SEC1 P-224: one-byte length 0x68.
rule = "der_key_file"
synth = "der:306802010104"
path = "keys/p224.key"
expect = 90

[[case]]
# SEC1 P-256 without the public key: one-byte length 0x31.
rule = "der_key_file"
synth = "der:303102010104"
path = "keys/p256.der"
expect = 90

# Hard negatives: each names the rule that must stay silent.

[[case]]
# A key name that only contains a keyword (local change; see UPSTREAM.md).
rule = "generic_api_key"
synth = "keyed:key_sha256"
path = "settings.py"
expect = "none"

[[case]]
# Entropy below the rule's minimum.
rule = "generic_api_key"
synth = "secret:low_entropy_generic"
path = "settings.py"
expect = "none"

[[case]]
# gitleaks' EXAMPLE-key allowlist.
rule = "aws_access_token"
synth = "secret:aws_example_key"
path = "src/main.rs"
expect = "none"

[[case]]
# Global path allowlist: vendored dependencies are not scanned for tokens.
rule = "github_pat"
synth = "secret:github_pat"
path = "node_modules/dep/index.js"
expect = "none"

[[case]]
# An X.509 certificate is DER but not a key.
rule = "der_key_file"
synth = "der:3082031c30820204"
path = "certs/server.der"
expect = "none"

[[case]]
# A key-store extension without a DER header.
rule = "der_key_file"
synth = "text:not a der file\n"
path = "keys/server.key"
expect = "none"

