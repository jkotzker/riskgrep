[package]
name = "riskgrep-claude"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "riskgrep-claude"
path = "src/main.rs"

[dependencies]
glob = "0.3.4"
# Pinned: two workarounds in src/bash.rs depend on 0.4.0 parsing quirks.
brush-parser = "=0.4.0"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
