[package]
name = "riskgrep-claude"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Claude Code PreToolUse hook that asks or denies before an agent reads files RiskGrep scores as secrets or biometric embeddings"
keywords = ["claude-code", "hook", "secrets", "agents", "security"]
categories = ["command-line-utilities", "development-tools"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "riskgrep-claude"
path = "src/main.rs"

[dependencies]
riskgrep-core = { path = "../riskgrep-core", version = "1.1.0" }
serde_json = "1"
ignore = "0.4"
glob = "0.3.4"
# Pinned: two workarounds in src/bash.rs depend on 0.4.0 parsing quirks.
brush-parser = "=0.4.0"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
